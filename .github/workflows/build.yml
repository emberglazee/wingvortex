name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/workflows/docs.yml"
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        # The lockfile predates npm 7; legacy-peer-deps accepts the 2021
        # peer-dependency layout as-is.
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Bundle the modman merger
        # The merger ships inside the extension so users don't need PSM
        # installed. Keep this tag in sync with the tested modman release.
        run: |
          mkdir -p dist/modman
          curl -fL --retry 3 -o dist/modman/modman.exe \
            https://github.com/emberglazee/project-modman/releases/download/v0.4.4/modman-win-amd64.exe
      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          name: game-projectwingman
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: game-projectwingman
          path: extension
      - name: Create Zip File
        run: cd extension && zip -r ../game-projectwingman.zip .
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            Download and install using the Extensions pane in Vortex.

            To manually install, extract the zip to %APPDATA%/Vortex/plugins/game-projectwingman.
          files: ./game-projectwingman.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: the upstream Nexus upload job (unex -> Nexus mod 189) is disabled
  # in this community fork. Re-enable it with this fork's own extension page
  # and NEXUS_TOKEN / NEXUS_COOKIES repository secrets once published.
